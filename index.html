<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registro dei voti</title>
</head>
<body>
    <h1>Registro dei voti</h1>

    <img id="immagine" src="img/insufficiente.png" alt="Semaforo rosso">

    <div>
        <label for="nome">Nome alunno:</label>
        <input type="text" id="nome">
    </div>

    <div>
        <label for="voto">Voto (1-10):</label>
        <input type="number" id="voto">
    </div>

    <button onclick="registraVoto()">Registra</button>

    <p id="messaggio"></p>

    <ul id="elenco"></ul>

    <table id="riepilogo" border="1">
        <tr>
            <th>Giudizio</th>
            <th>File immagine</th>
            <th>Testo alternativo (alt)</th>
        </tr>
        <tr>
            <td>Insufficiente</td>
            <td><img src="img/insufficiente.png" alt="Semaforo rosso" width="30"></td>
            <td>Semaforo rosso</td>
        </tr>
        <tr>
            <td>Sufficiente</td>
            <td><img src="img/sufficiente.png" alt="Semaforo giallo" width="30"></td>
            <td>Semaforo giallo</td>
        </tr>
        <tr>
            <td>Buono</td>
            <td><img src="img/buono.png" alt="Semaforo verde" width="30"></td>
            <td>Semaforo verde</td>
        </tr>
        <tr>
            <td>Ottimo</td>
            <td><img src="img/ottimo.png" alt="Stella" width="30"></td>
            <td>Stella</td>
        </tr>
    </table>

    <script src="dist/esVoti.js"></script>
</body>
</html>
