<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Canile Adotta un amico</title>
</head>
<body>
    <h1>Canile Adotta un amico</h1>

    <form>
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome">
        </div>
        <div>
            <label for="specie">Specie:</label>
            <select id="specie">
                <option value="">Scegli la specie</option>
                <option value="Cane">Cane</option>
                <option value="Gatto">Gatto</option>
                <option value="Coniglio">Coniglio</option>
            </select>
        </div>
        <div>
            <label>Taglia:</label>
            <input type="radio" name="taglia" value="Piccola" id="taglia-piccola">
            <label for="taglia-piccola">Piccola</label>
            <input type="radio" name="taglia" value="Media" id="taglia-media">
            <label for="taglia-media">Media</label>
            <input type="radio" name="taglia" value="Grande" id="taglia-grande">
            <label for="taglia-grande">Grande</label>
        </div>
        <div>
            <label for="eta">Età (anni):</label>
            <input type="number" id="eta" min="0" max="20">
        </div>
        <div>
            <input type="checkbox" id="vaccinato">
            <label for="vaccinato">Già vaccinato</label>
        </div>
        <button type="button" id="btn-registra">Registra</button>
    </form>

    <p id="messaggio"></p>

    <img id="immagine" src="" alt="" width="100">

    <h2>Pronti per l'adozione</h2>
    <ul id="elenco-pronti"></ul>

    <h2>In attesa di vaccino</h2>
    <ul id="elenco-attesa"></ul>

    <table border="1">
        <tr>
            <th>Cane</th>
            <th>Gatto</th>
            <th>Coniglio</th>
        </tr>
        <tr>
            <td id="conta-cane">0</td>
            <td id="conta-gatto">0</td>
            <td id="conta-coniglio">0</td>
        </tr>
    </table>

    <p id="piu-ospitata"></p>
    <p id="posti">Posti liberi: 6</p>

    <script src="dist/escanile.js"></script>
</body>
</html>
