<!DOCTYPE html>
<html lang="it">
<head>
     <script src="dist/esGelataio.js" defer></script>
    <meta charset="UTF-8">
    <title>Gelateria</title>
    <style>
        body {
            
            background-image: url("img/sfondo.jpg"); 
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Verdana, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            
            text-align: center; 
        }

        h1 {
            color: rgb(249, 96, 188);
            text-shadow: 2px 2px 5px rgb(7, 7, 7);
        }

        
        .blocco-centrato {
            background-color: rgb(255, 196, 196);
            padding: 20px;
            border: 2px solid rgb(255, 30, 203);
            width: 389px;
           
            margin: 20px auto; 
            text-align: left; 
        }

        div {
            margin: 10px 0px;
        }

        label {
            font-weight: bold;
        }

        button {
            background-color: rgb(255, 126, 251);
            color: white;
            border: 2px solid black;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            margin: 10px 5px;
        }

        button:hover {
            background-color: rgb(255, 71, 249);
            color: white;
        }

        #messaggio {
            color: rgb(255, 0, 251);
            font-weight: bold;
        }

        #scontrino-output, #sommario {
            color: rgb(105, 0, 0);
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border: 1px solid black;
        }

        th {
            background-color: rgb(253, 161, 238);
            color: rgb(255, 190, 246);
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Gelateria "Una pallina al giorno leva il dietologo di torno"</h1>
    
    
    <div class="blocco-centrato">
        <div>
            <label for="palline">Numero di palline (1-3):</label>
            <input type="number" id="palline" min="1" max="3">
        </div>

        <div>
            <label>Contenitore:</label>
            <input type="radio" name="contenitore" value="Coppetta" id="coppetta">
            <label for="coppetta">Coppetta</label>
            <input type="radio" name="contenitore" value="Cono" id="cono">
            <label for="cono">Cono</label>
        </div>

        <div>
            <label for="gusto">Gusto:</label>
            <select id="gusto">
                <option value="">Scegli il gusto</option>
                <option value="Panna">Panna</option>
                <option value="Cioccolato">Cioccolato</option>
                <option value="Fragola">Fragola</option>
                <option value="Limone">Limone</option>
                <option value="Pistacchio">Pistacchio</option>
            </select>
        </div>

        <div>
            <label>Topping:</label>
            <input type="checkbox" name="topping" value="Panna" id="top-panna"> <label for="top-panna">Panna</label>
            <input type="checkbox" name="topping" value="Caramello" id="top-caramello"> <label for="top-caramello">Caramello</label>
            <input type="checkbox" name="topping" value="Cioccolato" id="top-cioccolato"> <label for="top-cioccolato">Cioccolato</label>
        </div>

        <div style="text-align: center;">
            <button type="button" id="btn-scontrino">SCONTRINO</button>
            <button type="button" id="btn-fine">FINE GIORNATA</button>
        </div>
    </div>

    
    <p id="messaggio" class="blocco-centrato" style="border: none; padding: 0; background: transparent;"></p>
    
    <div id="scontrino-output" class="blocco-centrato"></div>
    
    <div id="sommario" class="blocco-centrato"></div>

</body>
</html>
