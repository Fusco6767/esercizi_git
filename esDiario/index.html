<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Diario di lettura</title>
</head>
<body>
    <h1>Diario di lettura della classe</h1>
    <form>
        <div>
            <label for="titolo">Titolo:</label>
            <input type="text" id="titolo">
        </div>
        <div>
            <label for="autore">Autore:</label>
            <input type="text" id="autore">
        </div>
        <div>
            <label for="genere">Genere:</label>
            <select id="genere">
                <option value="">Scegli il genere</option>
                <option value="Avventura">Avventura</option>
                <option value="Giallo">Giallo</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Storico">Storico</option>
            </select>
        </div>
        <div>
            <label>Formato:</label>
            <input type="radio" name="formato" value="Cartaceo" id="cartaceo">
            <label for="cartaceo">Cartaceo</label>
            <input type="radio" name="formato" value="Ebook" id="ebook">
            <label for="ebook">Ebook</label>
        </div>
        <div>
            <label for="stelle">Voto in stelle (1-5):</label>
            <input type="number" id="stelle" min="1" max="5">
        </div>
        <div>
            <input type="checkbox" id="consigliato">
            <label for="consigliato">Lo consiglio ai compagni</label>
        </div>
        <button type="button" onclick="registra()">Registra</button>
    </form>

    <p id="messaggio"></p>

    <img id="immagine" src="" alt="">

    <ul id="elenco"></ul>

    <table border="1">
        <tr>
            <th>Avventura</th>
            <th>Giallo</th>
            <th>Fantasy</th>
            <th>Storico</th>
        </tr>
        <tr>
            <td id="conta-avventura">0</td>
            <td id="conta-giallo">0</td>
            <td id="conta-fantasy">0</td>
            <td id="conta-storico">0</td>
        </tr>
    </table>

    <script src="dist/esDiario.js"></script>
</body>
</html>
